<main class="container" [class.dark-mode]="isDarkMode">
  <header>
    <div class="header-top">
      <h1>Buscador de Notas</h1>
      <button class="theme-toggle" (click)="toggleDarkMode()" [title]="isDarkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
        {{ isDarkMode ? '☀️ Claro' : '🌙 Oscuro' }}
      </button>
    </div>

    <input type="text" [(ngModel)]="searchTerm" (input)="onSearch()" placeholder="Buscar palabra, título o frase..." class="search-bar">
    
    <div class="upload-section">
      <label for="file-upload" class="upload-btn">📁 Cargar mis Blocs de Notas (.txt)</label>
      <input id="file-upload" type="file" multiple accept=".txt" (change)="onFilesSelected($event)" class="hidden-input">
    </div>
  </header>

  <section class="notes-grid">
    @for (note of notes; track note.id) {
      <!-- Agregamos el evento click a la tarjeta -->
      <article class="note-card" (click)="openNote(note)">
        <h2>{{ note.title }}</h2>
        <p>{{ note.content }}</p>
      </article>
    } @empty {
      <div class="no-results"><p>No se encontraron notas con esa búsqueda.</p></div>
    }
  </section>

  <!-- NUEVO: VENTANA MODAL (Basado en tu mockup) -->
  @if (selectedNote) {
    <div class="modal-overlay" (click)="closeNote()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        
        <div class="modal-header">
          <div class="modal-actions">
            @if (isEditing) {
              <button class="icon-btn save-btn" (click)="saveNote()" title="Guardar">💾 Guardar</button>
            } @else {
              <button class="icon-btn edit-btn" (click)="toggleEdit()" title="Editar">✏️ Editar</button>
            }
            <button class="icon-btn delete-btn" (click)="deleteSelectedNote()" title="Eliminar">🗑️</button>
            <button class="icon-btn close-btn" (click)="closeNote()" title="Cerrar">❌</button>
          </div>
        </div>
        
        <div class="modal-body">
          @if (isEditing) {
            <!-- Modo Edición -->
            <input type="text" [(ngModel)]="selectedNote.title" class="edit-title-input" placeholder="Título de la nota">
            <textarea [(ngModel)]="selectedNote.content" class="edit-content-textarea" placeholder="Escribe tu contenido aquí..."></textarea>
          } @else {
            <!-- Modo Lectura -->
            <h2 class="modal-title">{{ selectedNote.title }}</h2>
            <p class="modal-text">{{ selectedNote.content }}</p>
          }
        </div>

      </div>
    </div>
  }
</main>
